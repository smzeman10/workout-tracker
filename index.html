<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movement Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F7F3EE;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    color: #2C2C2C;
    padding: 20px 18px 40px;
    max-width: 420px;
    margin: 0 auto;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 26px;
    letter-spacing: 0.04em;
    color: #1A1A1A;
    margin-bottom: 2px;
  }
  .week-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #9A8C7E;
    margin-bottom: 18px;
  }

  /* GOAL ACHIEVED BANNER */
  .goal-banner {
    display: none;
    background: #2D6A2D;
    border-radius: 14px;
    padding: 18px 16px;
    text-align: center;
    margin-bottom: 16px;
  }
  .goal-banner.show { display: block; }
  .goal-banner-emoji { font-size: 32px; margin-bottom: 6px; }
  .goal-banner-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: #fff;
    font-weight: 400;
    margin-bottom: 2px;
  }
  .goal-banner-sub { font-size: 11px; color: #A8D4A8; letter-spacing: 0.06em; }

  /* MAIN RING / PROGRESS */
  .main-card {
    background: #fff;
    border-radius: 14px;
    padding: 18px 16px;
    margin-bottom: 12px;
  }
  .main-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .main-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #7A6A5A;
    font-weight: 500;
  }
  .main-mins {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    color: #1A1A1A;
    line-height: 1;
  }
  .main-mins span { font-size: 13px; color: #9A8C7E; font-family: 'DM Sans', sans-serif; font-weight: 300; }
  .big-bar-bg {
    background: #F0EAE2;
    border-radius: 20px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .big-bar-fill {
    height: 100%;
    border-radius: 20px;
    background: #6A9A6A;
    transition: width 0.4s ease;
  }
  .big-bar-fill.complete { background: #2D6A2D; }

  /* BREAKDOWN */
  .breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .breakdown-item {
    background: #F7F3EE;
    border-radius: 10px;
    padding: 10px 10px 8px;
  }
  .breakdown-type {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9A8C7E;
    margin-bottom: 4px;
  }
  .breakdown-mins {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: #2C2C2C;
    line-height: 1;
  }
  .breakdown-mins span { font-size: 10px; color: #9A8C7E; font-family: 'DM Sans', sans-serif; }

  /* SECTION TITLE */
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #7A6A5A;
    border-bottom: 0.5px solid #D4C9BC;
    padding-bottom: 5px;
    margin-bottom: 10px;
  }

  /* LOG BUTTONS */
  .btn-group-label {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #9A8C7E;
    margin-bottom: 6px;
    margin-top: 12px;
  }
  .btn-group-label:first-child { margin-top: 0; }
  .buttons-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-bottom: 4px;
  }
  .log-btn {
    background: #fff;
    border: 1px solid #E0D8CF;
    border-radius: 10px;
    padding: 10px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: #2C2C2C;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
    line-height: 1.3;
  }
  .log-btn:active { background: #EDE8E1; border-color: #C4A882; }
  .btn-mins {
    display: block;
    font-size: 10px;
    color: #9A8C7E;
    margin-top: 1px;
  }

  /* ACTIVITY LOG */
  .log-card {
    background: #fff;
    border-radius: 12px;
    padding: 12px 13px;
    margin-bottom: 12px;
    min-height: 50px;
  }
  .log-empty { font-size: 12px; color: #B0A396; font-style: italic; text-align: center; padding: 8px 0; }
  .log-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 0.5px solid #F0EAE2;
    font-size: 12px;
  }
  .log-item:last-child { border-bottom: none; }
  .log-item-left { color: #2C2C2C; }
  .log-item-type { font-size: 9px; color: #9A8C7E; text-transform: uppercase; letter-spacing: 0.07em; margin-top: 1px; }
  .log-item-right { display: flex; align-items: center; gap: 10px; }
  .log-item-mins { font-size: 11px; color: #6A9A6A; font-weight: 500; }
  .remove-btn {
    background: none;
    border: none;
    color: #C4B8A8;
    cursor: pointer;
    font-size: 16px;
    padding: 0 2px;
    line-height: 1;
  }

  /* RESET */
  .reset-btn {
    width: 100%;
    background: none;
    border: 1px solid #D4C9BC;
    border-radius: 10px;
    padding: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9A8C7E;
    cursor: pointer;
    margin-top: 4px;
  }
</style>
</head>
<body>

<h1>Weekly Tracker</h1>
<div class="week-label" id="week-label">—</div>

<!-- GOAL BANNER -->
<div class="goal-banner" id="goal-banner">
  <div class="goal-banner-emoji">🌿</div>
  <div class="goal-banner-title">150 Minutes Done</div>
  <div class="goal-banner-sub">Weekly goal complete</div>
</div>

<!-- MAIN PROGRESS -->
<div class="main-card">
  <div class="main-header">
    <span class="main-label">Total Movement</span>
    <span class="main-mins" id="total-display">0 <span>/ 150 min</span></span>
  </div>
  <div class="big-bar-bg">
    <div class="big-bar-fill" id="main-bar" style="width:0%"></div>
  </div>
  <div class="breakdown">
    <div class="breakdown-item">
      <div class="breakdown-type">Cardio</div>
      <div class="breakdown-mins" id="cardio-display">0 <span>min</span></div>
    </div>
    <div class="breakdown-item">
      <div class="breakdown-type">Strength</div>
      <div class="breakdown-mins" id="strength-display">0 <span>min</span></div>
    </div>
    <div class="breakdown-item">
      <div class="breakdown-type">Stretch</div>
      <div class="breakdown-mins" id="stretch-display">0 <span>min</span></div>
    </div>
  </div>
</div>

<!-- LOG -->
<div class="section-title">Log Activity</div>

<div class="btn-group-label">Cardio</div>
<div class="buttons-grid">
  <button class="log-btn" onclick="log('Walk 10 min', 'cardio', 30)">Walk<span class="btn-mins">10 min</span></button>
  <button class="log-btn" onclick="log('Walk 30 min', 'cardio', 30)">Walk<span class="btn-mins">30 min</span></button>
  <button class="log-btn" onclick="log('Walk 1 hr', 'cardio', 60)">Walk<span class="btn-mins">60 min</span></button>
  <button class="log-btn" onclick="log('Run 30 min', 'cardio', 30)">Run<span class="btn-mins">30 min</span></button>
  <button class="log-btn" onclick="log('Run 45 min', 'cardio', 45)">Run<span class="btn-mins">45 min</span></button>
</div>

<div class="btn-group-label">Strength</div>
<div class="buttons-grid">
  <button class="log-btn" onclick="log('Lifting 20 min', 'strength', 20)">Lifting<span class="btn-mins">20 min</span></button>
  <button class="log-btn" onclick="log('Lifting 30 min', 'strength', 30)">Lifting<span class="btn-mins">30 min</span></button>
  <button class="log-btn" onclick="log('Lifting 45 min', 'strength', 45)">Lifting<span class="btn-mins">45 min</span></button>
  <button class="log-btn" onclick="log('Lifting 60 min', 'strength', 60)">Lifting<span class="btn-mins">60 min</span></button>
</div>

<div class="btn-group-label">Dance Class</div>
<div class="buttons-grid">
  <button class="log-btn" onclick="log('Dance Class 1 hr', 'both', 60)">Dance Class<span class="btn-mins">60 min</span></button>
  <button class="log-btn" onclick="log('Dance Class 1.5 hr', 'both', 90)">Dance Class<span class="btn-mins">90 min</span></button>
</div>

<div class="btn-group-label">Stretching / Mobility (optional)</div>
<div class="buttons-grid">
  <button class="log-btn" onclick="log('Mobility 10 min', 'stretch', 10)">Mobility<span class="btn-mins">10 min</span></button>
  <button class="log-btn" onclick="log('Mobility 15 min', 'stretch', 15)">Mobility<span class="btn-mins">15 min</span></button>
</div>

<!-- ACTIVITY LOG -->
<div class="section-title" style="margin-top:16px">This Week</div>
<div class="log-card" id="log-list">
  <div class="log-empty">No activity logged yet</div>
</div>

<button class="reset-btn" id="reset-btn">Reset Week</button>

<script>
  const KEY = 'wt_v3';

  function getMonday() {
    const d = new Date();
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    const m = new Date(d);
    m.setDate(diff);
    m.setHours(0,0,0,0);
    return m.toISOString().split('T')[0];
  }

  function getWeekLabel() {
    const d = new Date();
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    const mon = new Date(d); mon.setDate(diff);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const o = { month: 'short', day: 'numeric' };
    return 'Week of ' + mon.toLocaleDateString('en-US', o) + ' – ' + sun.toLocaleDateString('en-US', o);
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const data = raw ? JSON.parse(raw) : null;
      if (!data || data.week !== getMonday()) {
        return { week: getMonday(), activities: [] };
      }
      return data;
    } catch(e) { return { week: getMonday(), activities: [] }; }
  }

  function save(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {}
  }

  function log(name, type, mins) {
    const data = load();
    data.activities.push({ name, type, mins, id: Date.now() });
    save(data);
    render();
  }

  function remove(id) {
    const data = load();
    data.activities = data.activities.filter(a => a.id !== id);
    save(data);
    render();
  }

  function reset() {
    {
      save({ week: getMonday(), activities: [] });
      render();
    }
  }

  function render() {
    document.getElementById('week-label').textContent = getWeekLabel();

    const data = load();
    const acts = data.activities;

    let cardio = 0, strength = 0, stretch = 0;
    acts.forEach(a => {
      if (a.type === 'cardio') cardio += a.mins;
      else if (a.type === 'strength') strength += a.mins;
      else if (a.type === 'stretch') stretch += a.mins;
      else if (a.type === 'both') { cardio += a.mins / 2; strength += a.mins / 2; }
    });

    cardio = Math.round(cardio);
    strength = Math.round(strength);
    const total = cardio + strength;
    const pct = Math.min(total / 150 * 100, 100);
    const done = total >= 150;

    document.getElementById('total-display').innerHTML = total + ' <span>/ 150 min</span>';
    document.getElementById('cardio-display').innerHTML = cardio + ' <span>min</span>';
    document.getElementById('strength-display').innerHTML = strength + ' <span>min</span>';
    document.getElementById('stretch-display').innerHTML = stretch + ' <span>min</span>';

    const bar = document.getElementById('main-bar');
    bar.style.width = pct + '%';
    bar.className = 'big-bar-fill' + (done ? ' complete' : '');

    const banner = document.getElementById('goal-banner');
    banner.className = 'goal-banner' + (done ? ' show' : '');

    const list = document.getElementById('log-list');
    if (acts.length === 0) {
      list.innerHTML = '<div class="log-empty">No activity logged yet</div>';
    } else {
      list.innerHTML = acts.map(a =>
        '<div class="log-item">' +
          '<div class="log-item-left">' +
            '<div>' + a.name + '</div>' +
            '<div class="log-item-type">' + (a.type === 'both' ? 'cardio + strength' : a.type) + '</div>' +
          '</div>' +
          '<div class="log-item-right">' +
            '<span class="log-item-mins">+' + a.mins + ' min</span>' +
            '<button class="remove-btn" onclick="remove(' + a.id + ')">×</button>' +
          '</div>' +
        '</div>'
      ).join('');
    }
  }

  document.getElementById('reset-btn').addEventListener('click', reset);
  render();
</script>
</body>
</html>
